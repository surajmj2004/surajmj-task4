<div class="div1 bg-body-tertiary">
   <h2>Products</h2>
</div>
<div class="container d-flex justify-content-around flex-wrap">
  <div class="row g-5">
     @for (item of products; track item.id) {
    <div class="col-3">
       <app-card [product]="item"></app-card>
    </div>
    }
    @empty {
    <p>No products found</p>
}
  </div>
</div>
