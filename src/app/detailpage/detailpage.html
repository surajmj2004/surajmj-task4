<div class="container">
    <div class="left">
         <img src="{{product.image}}" alt="product">
    </div>
    <div class="right">
          <h2>{{product.title}}</h2>
        <h4 class="pb-2 pt-2"> ${{product.price}}</h4>
        
        <h5 class="pb-2">Average Rating :<b> {{product.rating.rate}}</b></h5>
        <p class="p1"> Item Count : {{product.rating.count}}</p> 
        <a class="btn ">Add to cart</a>
         <p class="p2">{{product.description}}</p>
    </div>
</div>
